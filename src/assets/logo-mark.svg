<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Independence Day Golf Carts mark">
  <title>Independence Day Golf Carts</title>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123267"/>
      <stop offset="1" stop-color="#0A1F45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M256 20 462 86v170c0 106-84 189-206 236C134 445 50 362 50 256V86z" fill="url(#navy)"/>
  <path d="M256 20 462 86v170c0 106-84 189-206 236C134 445 50 362 50 256V86z" fill="url(#shine)"/>
  <path d="M256 20 462 86v170c0 106-84 189-206 236C134 445 50 362 50 256V86z" fill="none" stroke="#ffffff" stroke-width="16"/>

  <!-- Stripes across the lower shield -->
  <clipPath id="shieldClip">
    <path d="M256 36 446 97v159c0 98-78 175-190 219C144 431 66 354 66 256V97z"/>
  </clipPath>
  <g clip-path="url(#shieldClip)">
    <rect x="60" y="286" width="400" height="30" fill="#B31942"/>
    <rect x="60" y="346" width="400" height="30" fill="#B31942"/>
    <rect x="60" y="406" width="400" height="30" fill="#B31942"/>
    <rect x="60" y="316" width="400" height="30" fill="#ffffff"/>
    <rect x="60" y="376" width="400" height="30" fill="#ffffff"/>
  </g>

  <!-- Stars -->
  <g fill="#ffffff">
    <path d="M256 84l13.6 27.5 30.4 4.4-22 21.4 5.2 30.3L256 153.3l-27.2 14.3 5.2-30.3-22-21.4 30.4-4.4z"/>
  </g>

  <!-- Golf cart silhouette -->
  <g fill="#ffffff">
    <path d="M150 246h34l16-38h96l14 38h44a10 10 0 0 1 10 10v42a10 10 0 0 1-10 10h-16a30 30 0 0 0-60 0h-52a30 30 0 0 0-60 0h-16a10 10 0 0 1-10-10v-42a10 10 0 0 1 10-10zm60-30-9 26h84l-9-26z"/>
    <rect x="188" y="182" width="10" height="66" rx="5"/>
    <rect x="312" y="182" width="10" height="66" rx="5"/>
    <rect x="172" y="170" width="166" height="15" rx="7"/>
  </g>
  <g fill="#B31942">
    <circle cx="202" cy="330" r="24"/>
    <circle cx="314" cy="330" r="24"/>
  </g>
  <g fill="#ffffff">
    <circle cx="202" cy="330" r="9"/>
    <circle cx="314" cy="330" r="9"/>
  </g>
</svg>
