name: CI

# Runs on every pull request and on pushes to branches other than main.
# Builds from the committed snapshot with no network fetch, so a PR is not
# gated on the DMS being reachable.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

env:
  SITE_DOMAIN: memorialdaygolfcarts.com
  BASE_PATH: "/"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser tests need a built dist/ to drive, so the build comes first
      # and the full suite runs after it.
      - name: Build from the committed snapshot
        run: |
          npm run generate-seo
          node script/optimize-assets.ts --skip-carts
          npx vite build
          npm run prerender

      - name: Tests
        run: npm test

      - name: Verify the build
        run: npm run verify
