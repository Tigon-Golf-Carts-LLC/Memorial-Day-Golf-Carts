name: Deploy to GitHub Pages

# Triggers:
#   push to main        — deploy whatever was merged
#   workflow_dispatch   — deploy or refresh inventory on demand
#   schedule            — the daily inventory pull
#
# Inventory is frozen into the build. script/lib/schedule.ts decides, on every
# run, whether to pull and from where:
#   - DMS only between 12:00 and 5:00 AM Eastern, at most 3 attempts a day;
#   - TIGON IOT as recovery after the 3rd DMS attempt, or any time after
#     5:00 AM while the day has no successful pull;
#   - once a day: after a successful pull, later runs that day rebuild from the
#     saved snapshot without calling either source.
# A successful pull is committed back to main (src/data, public/data), so the
# next build keeps the last good snapshot and knows today is done.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_live:
        description: "Fail the build if the DMS is unreachable (no stale fallback)"
        type: boolean
        default: false
      relaxed:
        description: "One-time recovery: keep partial pages and do not require isRFS"
        type: boolean
        default: false
  schedule:
    # Hourly through the overnight window. 04–07 UTC covers 12, 1 and 2 AM
    # Eastern in both EST and EDT; the schedule module works out which run is
    # which DMS attempt from the real clock, so DST needs no cron change.
    - cron: "17 4-7 * * *"
    # Daytime IOT recovery checks (7 AM, 11 AM, 4 PM EST). They do nothing if
    # today already has a successful pull.
    - cron: "17 12,16,21 * * *"

permissions:
  # write: a successful pull is committed back to main (see the last build step).
  contents: write
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a scheduled refresh
# already uploading is not killed by a push — both should land.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The bare custom domain. Change both of these to move the site.
  SITE_DOMAIN: memorialdaygolfcarts.com
  # "/" for a custom domain or <user>.github.io.
  # "/<repo-name>/" for a project site, e.g. "/Memorial-Day-Golf-Carts/".
  BASE_PATH: "/"
  # Node 22: script/*.ts run through Node's native type stripping, so there is
  # no separate TypeScript compile step. Node 20 cannot do this.
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tests/ui-restore.test.ts drives a real browser. Runners ship no
      # Playwright browsers, so without this step `npm test` fails at launch
      # and the deploy job never runs.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Optimized cart photography is derived, not committed. Caching it means a
      # scheduled refresh only encodes photos for carts that are actually new,
      # which takes the image step from ~10 minutes to well under one.
      - name: Stamp the date for the image cache key
        id: datestamp
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Keyed by day rather than by the committed snapshot: the snapshot hash
      # never changes between runs, so the key always hit and newly-listed
      # carts' photos were re-encoded every run and never cached. A daily key
      # saves once a day and restores the previous day's work in between.
      - name: Restore optimized image cache
        uses: actions/cache@v4
        with:
          path: public/images/carts
          key: cart-images-${{ steps.datestamp.outputs.day }}
          restore-keys: |
            cart-images-

      # DMS first, then the TIGON IOT recovery copy. IOT_API_KEY is a
      # repository secret; it is sent only as the x-api-key header and is never
      # printed. INVENTORY_RELAXED_UNTIL (an Eastern date) turns on the one-time
      # relaxed validation and switches it off by itself once the date passes.
      # The result, with counts, is written to this run's summary page.
      - name: Fetch inventory (DMS, then IOT)
        env:
          IOT_API_KEY: ${{ secrets.IOT_API_KEY }}
          INVENTORY_RELAXED_UNTIL: "2026-11-13"
        run: npm run fetch-data -- ${{ inputs.require_live && '--require-live' || '' }} ${{ inputs.relaxed && '--relaxed' || '' }}

      - name: Generate SEO files
        run: npm run generate-seo

      - name: Optimize assets
        run: npm run optimize-assets

      - name: Build
        run: npx vite build

      # The TIGON IOT webhook key is a repository secret, never committed: this
      # repository is public. Lead forms post to https://tigoniot.com/hooks/<key>.
      - name: Check the lead-form webhook key
        env:
          TIGON_WEBHOOK_KEY: ${{ secrets.TIGON_WEBHOOK_KEY }}
        run: |
          if [ -z "$TIGON_WEBHOOK_KEY" ]; then
            echo "::warning::TIGON_WEBHOOK_KEY secret is not set — lead forms will render as a call/email fallback."
          fi

      - name: Prerender every route
        env:
          TIGON_WEBHOOK_KEY: ${{ secrets.TIGON_WEBHOOK_KEY }}
        run: npm run prerender

      - name: Check the performance budget
        run: npm run budget

      - name: Verify the build
        run: npm run verify

      - name: Run the filter tests
        run: npm test

      # Persist a successful pull: the committed snapshot is this site's only
      # store, so the next build serves it and the schedule sees today is done.
      # Pushes made with GITHUB_TOKEN do not start another workflow run.
      - name: Save the inventory snapshot
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if git diff --quiet -- src/data public/data; then
            echo "Snapshot unchanged — nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data public/data
          git commit -m "Inventory snapshot $(node -p "require('./src/data/snapshot.json').source + ' ' + require('./src/data/snapshot.json').updatedAt")"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "::warning::Could not save the snapshot to main — the next run may pull again."

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
